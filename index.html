<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼스 노트 · 시간표와 과제</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f0;color:#193731;font:16px/1.55 system-ui,sans-serif;word-break:keep-all}main,header,footer{max-width:1050px;margin:auto;padding:20px 4%}header{display:flex;justify-content:space-between;border-bottom:1px solid #ced6c9}header b{font-family:Georgia,serif;font-size:22px}h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.075em;margin:4px 0 16px}h2{font-size:23px;margin:0 0 18px}small,footer{color:#475e55}.week{background:#164e42;color:white;border-radius:16px;padding:22px;display:flex;gap:6px;margin:14px 0 24px}.week button{flex:1;background:transparent;color:white;border:0;padding:9px 2px}.week button[aria-pressed=true]{background:#e3f7ac;color:#163b31}.week span{display:block;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}section,details{background:white;padding:22px;border:1px solid #d3dbd1;border-radius:14px;margin-bottom:16px}button,summary{cursor:pointer;font:inherit}button{border:1px solid #9fb3a6;border-radius:8px;background:#fff;padding:7px 13px;color:inherit}summary{font-weight:700}label{display:block;margin:9px 0}input,select{font:inherit;max-width:100%;padding:7px;border:1px solid #9fb3a6;border-radius:6px}input:not([type=checkbox]),select{display:block;width:100%}form button,.primary{background:#164e42;color:white}.row{border-top:1px solid #d4ded4;padding:12px 0}.row p{margin:4px 0}.row button{font-size:14px;margin:3px}.over{color:#984528}a{color:#164e42}footer{font-size:14px}dialog{width:min(420px,92vw);border:0;border-radius:16px;padding:24px;color:inherit}dialog::backdrop{background:#132f2980}@media(max-width:680px){.grid{display:block}.week{padding:10px;gap:2px}section{padding:17px}header{align-items:center}}
</style>
<header><b>Campus Note</b><small>나의 학기 플래너</small></header><main><small id="stamp"></small><h1>수업과 과제</h1><div id="week" class="week" aria-label="이번 주 날짜 선택"></div>
<div class="grid"><section><h2 id="dayTitle"></h2><div id="classes"></div><button onclick="courseBox.showModal()">수업 등록</button></section><section><h2>과제 마감</h2><div id="tasks"></div><button class="primary" onclick="newTask()">과제 추가</button></section></div>
<details><summary>공지 확인 알림</summary><p>매일 Canvas 공지를 확인할 시간을 정하고 캘린더 앱에 추가하세요.</p><label>매일 확인할 시간<input id="daily" type="time" value="18:00"></label><button onclick="dailyCalendar()">캘린더로 내보내기</button></details>
<details><summary>등록한 수업 관리</summary><div id="manage"></div></details><details><summary>제출한 과제</summary><div id="doneList"></div></details>
<p id="notice" role="status"></p></main><footer>입력한 일정은 현재 브라우저에 저장됩니다.　<a href="index.html" download="index.html">홈페이지 소스 받기</a></footer>
<dialog id="courseBox"><form id="courseForm"><h2>수업 등록</h2><label>과목명<input name="subject" required maxlength="80"></label><label>매주 반복할 요일<select name="weekday"></select></label><label>시작 시간<input type="time" name="time" required></label><button>등록</button> <button type="button" onclick="courseBox.close()">닫기</button></form></dialog>
<dialog id="taskBox"><form id="taskForm"><h2>과제 추가</h2><details><summary>한 줄로 입력</summary><label>과목 · 날짜 · 할 일<input id="quick" placeholder="약리학 다음 주 수요일 수업 전까지 질문 하나"></label><button type="button" id="parse">입력칸에 채우기</button><p id="hint"></p></details><label>과목<input name="subject" list="subjects" required maxlength="80"></label><datalist id="subjects"></datalist><label>할 일<input name="title" placeholder="발표 질문 1개 제출" required maxlength="220"></label><label>마감 · 미정이면 비워두세요<input type="datetime-local" name="due"></label><label>캘린더 알림<select name="lead"><option value="1440">하루 전</option><option value="60">1시간 전</option><option value="10">10분 전</option></select></label><button>저장</button> <button type="button" onclick="taskBox.close()">닫기</button></form></dialog>
<script>
const key='campus-note-v1', weekdays='일월화수목금토', el=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem(key)||'{"courses":[],"tasks":[],"daily":"18:00"}');
let selected=new Date(); selected.setHours(0,0,0,0);
function save(){try{localStorage.setItem(key,JSON.stringify(state));render()}catch{el('notice').textContent='저장 공간을 사용할 수 없습니다. 브라우저 설정을 확인하세요.'}}
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
function button(text,action){const b=node('button',text);b.onclick=action;return b}
function dateText(d){return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})}
function newTask(subject=''){taskForm.reset();taskForm.elements.subject.value=subject;taskBox.showModal()}
function drawTasks(list,target,done){target.replaceChildren();if(!list.length)target.append(node('p',done?'제출한 과제가 여기에 모여요.':'등록된 과제가 없어요.'));for(const t of list){const r=node('div','');r.className='row';r.append(node('small',t.subject),node('p',t.title));const d=t.due?new Date(t.due):null;const line=node('p',d?dateText(d)+' '+t.due.slice(11):'마감 미정');if(d&&d<new Date()&&!done){line.prepend('기한 지남 · ');line.className='over'}r.append(line,button(done?'미제출로 복원':'제출 완료',()=>{t.done=!done;save()}));if(d&&!done)r.append(button('캘린더 알림',()=>calendar(t.id,t.subject+' · '+t.title,d,t.lead,false)));target.append(r)}}
function render(){const now=new Date();el('stamp').textContent=now.getFullYear()+'년 '+dateText(now);const start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-(start.getDay()+6)%7);week.replaceChildren();for(let i=0;i<7;i++){const date=new Date(start);date.setDate(start.getDate()+i);const b=button(weekdays[date.getDay()],()=>{selected=date;render()});b.append(node('span',date.getDate()));b.setAttribute('aria-pressed',+selected===+date);week.append(b)}
dayTitle.textContent=dateText(selected)+' 수업';classes.replaceChildren();manage.replaceChildren();subjects.replaceChildren();const courses=[...state.courses].sort((a,b)=>a.time.localeCompare(b.time));for(const c of courses){const r=node('div',weekdays[c.day]+' '+c.time+' · '+c.subject+' ');r.className='row';r.append(button('삭제',()=>{if(confirm('이 수업을 삭제할까요? 등록한 과제는 유지됩니다.')){state.courses=state.courses.filter(v=>v.id!==c.id);save()}}));manage.append(r);if(c.day===selected.getDay()){const row=node('div',c.time+'　'+c.subject+' ');row.className='row';row.append(button('과제 추가',()=>newTask(c.subject)));classes.append(row)}}for(const name of new Set(courses.map(c=>c.subject))){const o=node('option','');o.value=name;subjects.append(o)}if(!classes.children.length)classes.append(node('p','이날 등록된 수업이 없어요.'));if(!courses.length)manage.append(node('p','수업을 먼저 등록해 주세요.'));const ts=[...state.tasks].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));drawTasks(ts.filter(t=>!t.done),tasks,false);drawTasks(ts.filter(t=>t.done),doneList,true);daily.value=state.daily}
for(let i=0;i<7;i++){const o=node('option',weekdays[i]+'요일');o.value=i;courseForm.elements.weekday.append(o)}courseForm.elements.weekday.value=selected.getDay();
courseForm.onsubmit=e=>{e.preventDefault();const f=e.target.elements;const subject=f.subject.value.trim();if(!subject)return;state.courses.push({id:crypto.randomUUID(),subject,day:+f.weekday.value,time:f.time.value});selected.setDate(selected.getDate()+(+f.weekday.value+6)%7-(selected.getDay()+6)%7);save();courseBox.close();courseForm.reset()};
taskForm.onsubmit=e=>{e.preventDefault();const f=e.target.elements;if(!f.subject.value.trim()||!f.title.value.trim())return;state.tasks.push({id:crypto.randomUUID(),subject:f.subject.value.trim(),title:f.title.value.trim(),due:f.due.value,lead:+f.lead.value,done:false});save();taskBox.close()};
el('parse').onclick=()=>{
 const raw=el('quick').value.trim(), f=taskForm.elements;
 const course=[...state.courses].sort((a,b)=>b.subject.length-a.subject.length).find(c=>raw.includes(c.subject));
 const match=raw.match(/(다음|이번)\s*주\s*([일월화수목금토])요일/);
 if(course) f.subject.value=course.subject;
 f.due.value='';
 if(match && course && raw.includes('수업 전')){
 const day=weekdays.indexOf(match[2]), times=state.courses.filter(c=>c.subject===course.subject&&c.day===day);
 if(times.length===1){const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7+(day+6)%7+(match[1]==='다음'?7:0));
 const pad=n=>String(n).padStart(2,'0');f.due.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+times[0].time}}
 f.title.value=raw.replace(course?.subject||'','').replace(match?.[0]||'','').replace(/수업 전(?:까지)?/,'').trim();
 el('hint').textContent='채워진 과목과 마감을 확인한 뒤 저장하세요.';
};
function calendar(id,title,date,lead,repeat){const utc=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';const safe=title.replaceAll('\\','\\\\').replaceAll(',','\\,').replaceAll(';','\\;').replace(/[\r\n]/g,' ');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Campus Note//KO','BEGIN:VEVENT','UID:'+id+'@campus-note','DTSTAMP:'+utc(new Date()),'DTSTART:'+utc(date),'SUMMARY:'+safe];if(repeat)lines.push('RRULE:FREQ=DAILY');lines.push('BEGIN:VALARM','TRIGGER:-PT'+lead+'M','ACTION:DISPLAY','DESCRIPTION:'+safe,'END:VALARM','END:VEVENT','END:VCALENDAR');const url=URL.createObjectURL(new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const a=node('a','');a.href=url;a.download='campus-note.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);notice.textContent='다운로드한 일정을 캘린더 앱에 추가하고 알림 시간을 확인하세요.'}
function dailyCalendar(){if(!daily.value)return;state.daily=daily.value;save();const date=new Date(),[h,m]=state.daily.split(':').map(Number);date.setHours(h,m,0,0);if(date<=new Date())date.setDate(date.getDate()+1);calendar('daily-check','Canvas 새 공지 확인',date,0,true)}
render();
</script></html>
